<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in · Peach Time</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="brand.css">
  <script src="app.js" defer></script>
  <link rel="stylesheet" href="prototype.css">
  <script src="prototype.js" defer></script>
</head>
<body data-proto-role="Signed out">
<main class="auth-wrap" id="main">
  <div class="auth-card">
    <div class="brand"><span class="brand-dot" aria-hidden="true"></span>Peach Time</div>
    

    
<h1>Sign in</h1>
<form method="post" novalidate>
  
  <input type="hidden" name="next" value="">
  

  
<div class="field">
  <label for="id_email">Email</label>
  <input type="email" name="email" autocomplete="username" autofocus maxlength="320" required id="id_email">
  
  
</div>


  
<div class="field">
  <label for="id_password">Password</label>
  <input type="password" name="password" autocomplete="current-password" required id="id_password">
  
  
</div>


  <div class="form-actions"><button class="btn btn-primary" type="submit">Sign in</button>
  <a href="#" data-proto-missing="This screen isn&#x27;t part of the preview." class="small">Forgot your password?</a></div>
</form>
<p class="small muted">Accounts are by invitation only.</p>

  </div>
</main>
</body>
</html>
